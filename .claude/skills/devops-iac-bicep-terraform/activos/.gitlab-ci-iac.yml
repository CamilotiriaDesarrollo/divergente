# .gitlab-ci-iac.yml — IaC en GitLab institucional (LÍNEA GOBIERNO).
# Regla dura: `apply` a producción = compuerta MANUAL = aprobación del CCC (SDC F-GSI-037, M-GSI-003).
# Estado gestionado por GitLab (backend HTTP nativo): no requiere storage aparte.
# N0: VERIFICAR el tag de la imagen; considerar OpenTofu si la entidad exige OSS (ver gotcha licencia).

stages: [validate, plan, apply]

variables:
  TF_ROOT: infra/terraform
  TF_STATE_NAME: "${CI_PROJECT_NAME}-${CI_COMMIT_REF_SLUG}"
  TF_ADDRESS: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/terraform/state/${TF_STATE_NAME}"

default:
  image: hashicorp/terraform:1.9   # o ghcr.io/opentofu/opentofu:1.8
  before_script:
    - cd "${TF_ROOT}"
    - terraform init
        -backend-config="address=${TF_ADDRESS}"
        -backend-config="lock_address=${TF_ADDRESS}/lock"
        -backend-config="unlock_address=${TF_ADDRESS}/lock"
        -backend-config="username=gitlab-ci-token"
        -backend-config="password=${CI_JOB_TOKEN}"
        -backend-config="lock_method=POST" -backend-config="unlock_method=DELETE"

validate:
  stage: validate
  script:
    - terraform fmt -check -recursive
    - terraform validate

plan:
  stage: plan
  script: terraform plan -out=tfplan
  artifacts:
    paths: ["${TF_ROOT}/tfplan"]
    expire_in: 7 days

apply:
  stage: apply
  script: terraform apply -auto-approve tfplan
  dependencies: [plan]
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual   # <- aprobación humana en el pipeline = aprobación del CCC (comité del jueves)
  environment:
    name: produccion
