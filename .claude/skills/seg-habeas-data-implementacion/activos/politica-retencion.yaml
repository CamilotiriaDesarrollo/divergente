# politica-retencion.yaml — Matriz finalidad -> base legal -> retención -> acción.
# Ley 1581/2012 (principio de finalidad y temporalidad). El reloj de retención arranca en la última
# actividad del titular o al revocarse el consentimiento, lo que ocurra primero.
# Este archivo es la fuente de verdad de sp_PurgarPorRetencion y del job programado. SIN secretos.
politica_version: "1.0"
aviso_privacidad_url: "${URL_POLITICA_PRIVACIDAD}"
responsable_tratamiento: "${RAZON_SOCIAL_RESPONSABLE}"   # Responsable ante la SIC (Superintendencia de Industria y Comercio)
contacto_datos: "${CORREO_HABEAS_DATA}"                  # canal de atención al titular (art. 8 Ley 1581)

finalidades:
  - codigo: BOLETIN
    descripcion: "Envío de boletín institucional"
    base_legal: consentimiento          # requiere consentimiento previo, expreso e informado
    retencion_dias: 730                  # 2 años sin interacción -> baja
    accion_al_vencer: anonimizar
  - codigo: CONTACTO_ALIADO
    descripcion: "Contacto entre aliados de la red"
    base_legal: consentimiento
    retencion_dias: 1825                 # 5 años
    accion_al_vencer: anonimizar
  - codigo: OBLIGACION_LEGAL
    descripcion: "Registros contables/contractuales"
    base_legal: obligacion_legal         # NO requiere consentimiento; la retención la fija la ley
    retencion_dias: 3650                 # 10 años (verificar norma contable/contractual aplicable con cumplimiento-normativo)
    accion_al_vencer: bloquear           # bloqueo de tratamiento, no borrado, mientras exista la obligación

datos_sensibles:
  # Art. 5-6 Ley 1581: consentimiento explícito, opcional (no se puede condicionar el servicio a entregarlos),
  # prohibido tratar datos sensibles de niñas, niños y adolescentes.
  requiere_consentimiento_explicito: true
  cifrado_en_reposo: true
