# flyway.conf — configuración base portable (Flyway Community)
# Copia este archivo al proyecto (p. ej. db/flyway.conf) y NO lo commitees con credenciales.
# Todas las credenciales se inyectan por variable de entorno: Flyway lee ${VAR} del entorno.
# Doc a verificar contra la versión instalada: `flyway --version` (probado mentalmente contra Flyway 10/11).

# --- Conexión (nunca hardcodear password aquí) ---
# SQL Server / Azure SQL:
flyway.url=jdbc:sqlserver://${DB_HOST}:${DB_PORT};databaseName=${DB_NAME};encrypt=true;trustServerCertificate=true
# PostgreSQL (línea privada, si aplica):
# flyway.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
flyway.user=${DB_USER}
flyway.password=${DB_PASSWORD}

# --- Ubicación de los scripts versionados ---
# Reutiliza la estructura ya usada en el portafolio (schema/ seed/ migrations/).
flyway.locations=filesystem:./db/migrations

# --- Baseline de una BD que YA existe con scripts aplicados a mano ---
# baselineOnMigrate=true: si la BD tiene objetos pero no historial de Flyway,
# marca la versión baseline y NO intenta re-crear lo existente (evita romper prod).
flyway.baselineOnMigrate=true
flyway.baselineVersion=${BASELINE_VERSION}
flyway.baselineDescription=baseline_estado_actual

# --- Seguridad / gobierno ---
# clean está PROHIBIDO fuera de entornos efímeros: destruye toda la BD.
flyway.cleanDisabled=true
# valida checksums antes de migrar: detecta que alguien editó un script ya aplicado.
flyway.validateOnMigrate=true
# tabla de historial (default flyway_schema_history); nómbrala explícita para auditoría.
flyway.table=flyway_schema_history

# --- Placeholders para parametrizar scripts por entorno (opcional) ---
# En el .sql usas ${schema_name}; aquí defines el valor por entorno.
flyway.placeholders.schema_name=${DB_SCHEMA}
