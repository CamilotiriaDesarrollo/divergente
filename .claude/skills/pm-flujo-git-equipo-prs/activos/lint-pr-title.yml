# Copiar a: .github/workflows/lint-pr-title.yml
# Valida que el título del PR siga Conventional Commits (se convierte en el mensaje del commit squash).
# Registrar "pr-title-conventional" como status check requerido en la protección de rama.
# Sin dependencias de terceros -> portable a GitLab CI con la misma expresión regular.
name: pr-title-conventional
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

jobs:
  pr-title-conventional:
    runs-on: ubuntu-latest
    steps:
      - name: Validar título Conventional Commits
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          echo "Título del PR: $TITLE"
          patron='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9\-]+\))?!?: .+'
          if ! echo "$TITLE" | grep -Eq "$patron"; then
            echo "::error::El título debe seguir Conventional Commits, ej: 'feat(mapa): coropleta por departamento'"
            exit 1
          fi
          echo "OK"
